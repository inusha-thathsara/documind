name: Sync DEV.to Articles to Sanity

on:
  # Run automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-sync of all articles (overwrite existing)'
        required: false
        type: boolean
        default: false

jobs:
  sync-articles:
    name: Sync DEV.to Posts to Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Run DEV.to Synchronization
        working-directory: web
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Running forced sync on all articles..."
            node scripts/import-devto.mjs --force
          else
            echo "Checking for new/updated articles..."
            node scripts/import-devto.mjs
          fi
